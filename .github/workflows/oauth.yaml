name: OAuth

on:
  pull_request:
    branches:
      - "1.0-develop"

jobs:
  deployment:
    name: OAuth deployment
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      database:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - run: cp .env.ci .env
      # Install from the committed lock file so this workflow exercises the same
      # Passport release that a deployment would install.
      - run: composer install --no-interaction --no-progress --prefer-dist
      # The deployment sequence OAUTH.md tells an operator to run, in that order,
      # so the documented steps are exercised rather than only written down. The
      # test suites themselves run in the Tests workflow; repeating them here
      # would only make every pull request slower.
      - run: php artisan passport:keys --no-interaction
      - run: php artisan migrate --force --no-interaction
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
      - run: php artisan vendor:publish --tag=passport-migrations --no-interaction
      - run: php artisan migrate --force --no-interaction
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
