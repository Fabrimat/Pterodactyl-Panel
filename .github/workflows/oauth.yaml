name: OAuth

on:
  push:
    branches:
      - "feature/per-user-2fa-and-mcp-server"

jobs:
  tests:
    name: OAuth Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      database:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - run: cp .env.ci .env
      # Install from the committed lock file so this workflow exercises the same
      # Passport release that a deployment would install.
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-files
          path: |
            composer.json
            composer.lock
      - run: php artisan passport:keys --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
        env:
          DB_HOST: UNIT_NO_DB
      - run: vendor/bin/phpunit tests/Integration
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
      # The remaining deployment steps an operator has to run, verified against the
      # database the integration tests just migrated.
      - run: php artisan vendor:publish --tag=passport-migrations --no-interaction
      - run: php artisan migrate --force --no-interaction
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
